backend:
  name: github
  repo: danytrox/landingconvierte
  branch: main
  # URL of the Cloudflare Worker that runs worker/src/index.js
  base_url: https://landingconvierte-cms-auth.REPLACE_WITH_ACCOUNT.workers.dev
  auth_endpoint: auth
  commit_messages:
    update: "content: update {{slug}}"

locale: es
media_folder: uploads
public_folder: /uploads

collections:
  - name: paginas
    label: Contenido del sitio
    format: json
    editor:
      preview: false
    files:
      # ------------------------------------------------------------------ site
      - name: site
        label: General (menú y pie de página)
        file: content/site.json
        fields:
          - { name: brand, label: Marca, widget: string }
          - { name: alternateName, label: Nombre alternativo, widget: string }
          - { name: domain, label: Dominio (con https), widget: string }
          - { name: organizationDescription, label: Descripción de la empresa (SEO), widget: text }
          - { name: areaServed, label: País donde atiende, widget: string }
          - { name: themeColor, label: Color del tema (navegador móvil), widget: color }
          - { name: skipLink, label: Texto "saltar al contenido", widget: string }
          - name: nav
            label: Menú principal
            widget: list
            fields:
              - { name: label, label: Texto, widget: string }
              - { name: href, label: Enlace, widget: string, hint: "Ancla (#seccion) o ruta (/landing-page)" }
          - { name: navCta, label: Botón del menú, widget: string }
          - { name: navCtaHref, label: Enlace del botón del menú, widget: string }
          - name: footer
            label: Pie de página
            widget: object
            fields:
              - { name: brand, label: Marca, widget: string }
              - name: links
                label: Enlaces
                widget: list
                fields:
                  - { name: label, label: Texto, widget: string }
                  - { name: href, label: Enlace, widget: string }
              - { name: legal, label: Texto legal, widget: string, hint: "{year} se reemplaza por el año actual" }

      # ----------------------------------------------------------------- index
      - name: index
        label: Página de inicio
        file: content/index.json
        fields:
          - &meta
            name: meta
            label: SEO
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Título de la pestaña, widget: string }
              - { name: description, label: Meta descripción, widget: text }
              - { name: ogTitle, label: Título al compartir, widget: string }
              - { name: ogDescription, label: Descripción al compartir, widget: text }
              - { name: ogImageAlt, label: Texto alternativo de la imagen al compartir, widget: string }
              - { name: canonical, label: URL canónica, widget: string }
          - name: hero
            label: Portada
            widget: object
            fields:
              - { name: title, label: Título, widget: text }
              - { name: lead, label: Bajada, widget: text }
              - { name: ctaPrimary, label: Botón principal, widget: string }
              - { name: ctaPrimaryHref, label: Enlace botón principal, widget: string }
              - { name: ctaSecondary, label: Botón secundario, widget: string }
              - { name: ctaSecondaryHref, label: Enlace botón secundario, widget: string }
              - { name: note, label: Nota bajo los botones, widget: string }
          - name: demo
            label: Demo de rubros (portada)
            widget: object
            collapsed: true
            fields:
              - { name: prompt, label: Texto sobre las pestañas, widget: string }
              - { name: caption, label: Leyenda bajo la demo, widget: string }
              - { name: legend, label: Explicación numerada, widget: list, field: { name: item, label: Punto, widget: string } }
              - name: examples
                label: Rubros
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - { name: key, label: Identificador (sin espacios), widget: string, pattern: ["^[a-z0-9-]+$", "Solo minúsculas, números y guiones"] }
                  - { name: label, label: Nombre de la pestaña, widget: string }
                  - { name: accent, label: Color, widget: color }
                  - { name: url, label: Dominio de ejemplo, widget: string }
                  - { name: brand, label: Marca de ejemplo, widget: string }
                  - { name: title, label: Titular, widget: string }
                  - { name: sub, label: Bajada, widget: string }
                  - { name: cta, label: Botón, widget: string }
                  - { name: trust, label: Señales de confianza, widget: list, field: { name: item, label: Señal, widget: string } }
          - name: services
            label: Servicios
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: intro, label: Introducción, widget: text }
              - name: items
                label: Servicios
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Nombre, widget: string }
                  - { name: description, label: Descripción, widget: text }
                  - { name: linkText, label: Texto del enlace, widget: string }
                  - { name: linkHref, label: Enlace, widget: string }
              - { name: includedTitle, label: Título de "incluye", widget: string }
              - { name: included, label: Lo que incluye, widget: list, field: { name: item, label: Ítem, widget: string } }
          - name: compare
            label: Landing vs sitio web
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: intro, label: Introducción, widget: text }
              - name: columns
                label: Columnas
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Título, widget: string }
                  - name: rows
                    label: Filas
                    widget: list
                    fields:
                      - { name: term, label: Concepto, widget: string }
                      - { name: description, label: Detalle, widget: string }
                  - { name: linkText, label: Texto del enlace, widget: string }
                  - { name: linkHref, label: Enlace, widget: string }
              - { name: noteBefore, label: Nota (antes del enlace), widget: string }
              - { name: noteLinkText, label: Nota (texto del enlace), widget: string }
              - { name: noteLinkHref, label: Nota (enlace), widget: string }
              - { name: noteAfter, label: Nota (después del enlace), widget: string }
          - &process
            name: process
            label: Proceso
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - name: steps
                label: Pasos
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Paso, widget: string }
                  - { name: description, label: Descripción, widget: text }
          - &faq
            name: faq
            label: Preguntas frecuentes
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - name: items
                label: Preguntas
                widget: list
                summary: "{{fields.question}}"
                fields:
                  - { name: question, label: Pregunta, widget: string }
                  - { name: answer, label: Respuesta, widget: text }
          - name: contact
            label: Formulario de contacto
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: intro, label: Introducción, widget: text }
              - { name: bullets, label: Puntos, widget: list, field: { name: item, label: Punto, widget: string } }
              - { name: subject, label: Asunto del correo recibido, widget: string }
              - { name: fromName, label: Remitente del correo recibido, widget: string }
              - name: labels
                label: Etiquetas de los campos
                widget: object
                collapsed: true
                fields:
                  - { name: name, label: Nombre, widget: string }
                  - { name: email, label: Correo, widget: string }
                  - { name: company, label: Negocio, widget: string }
                  - { name: companyOptional, label: Negocio (opcional), widget: string }
                  - { name: phone, label: Teléfono, widget: string }
                  - { name: phoneOptional, label: Teléfono (opcional), widget: string }
                  - { name: service, label: Servicio, widget: string }
                  - { name: message, label: Mensaje, widget: string }
                  - { name: messagePlaceholder, label: Ejemplo en el mensaje, widget: string }
                  - { name: submit, label: Botón enviar, widget: string }
              - { name: serviceOptions, label: Opciones de servicio, widget: list, field: { name: item, label: Opción, widget: string } }
              - { name: web3formsAccessKey, label: Clave Web3Forms (no tocar), widget: string }
          - { name: actionBar, label: Botón fijo en móvil, widget: string }
          - name: schema
            label: Datos estructurados (SEO avanzado)
            widget: object
            collapsed: true
            fields:
              - { name: pageDescription, label: Descripción de la página, widget: text }
              - { name: serviceName, label: Nombre del servicio, widget: string }
              - { name: serviceType, label: Tipo de servicio, widget: string }
              - { name: serviceDescription, label: Descripción del servicio, widget: text }

      # ---------------------------------------------------------- landing-page
      - name: landing-page
        label: Página "Diseño de landing pages"
        file: content/landing-page.json
        fields:
          - *meta
          - name: hero
            label: Portada
            widget: object
            fields:
              - { name: title, label: Título, widget: text }
              - { name: lead, label: Bajada, widget: text }
              - { name: ctaPrimary, label: Botón principal, widget: string }
              - { name: ctaPrimaryHref, label: Enlace botón principal, widget: string }
              - { name: ctaSecondary, label: Botón secundario, widget: string }
              - { name: ctaSecondaryHref, label: Enlace botón secundario, widget: string }
          - name: focus
            label: Para qué sirve
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: intro, label: Introducción, widget: text }
              - name: items
                label: Ítems
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descripción, widget: text }
          - name: content
            label: Contenido
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: intro, label: Introducción, widget: text }
              - name: columns
                label: Columnas
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: items, label: Ítems, widget: list, field: { name: item, label: Ítem, widget: string } }
          - name: compare
            label: Landing vs sitio completo
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - name: columns
                label: Columnas
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: Título, widget: string }
                  - { name: description, label: Descripción, widget: text }
              - { name: noteBefore, label: Nota (antes del enlace), widget: string }
              - { name: noteLinkText, label: Nota (texto del enlace), widget: string }
              - { name: noteLinkHref, label: Nota (enlace), widget: string }
              - { name: noteAfter, label: Nota (después del enlace), widget: string }
          - *process
          - *faq
          - name: ctaBand
            label: Llamado final
            widget: object
            fields:
              - { name: heading, label: Título, widget: string }
              - { name: textBefore, label: Texto (antes del enlace), widget: string }
              - { name: linkText, label: Texto del enlace, widget: string }
              - { name: linkHref, label: Enlace, widget: string }
              - { name: cta, label: Botón, widget: string }
              - { name: ctaHref, label: Enlace del botón, widget: string }
          - name: schema
            label: Datos estructurados (SEO avanzado)
            widget: object
            collapsed: true
            fields:
              - { name: pageDescription, label: Descripción de la página, widget: text }
              - { name: serviceName, label: Nombre del servicio, widget: string }
              - { name: serviceType, label: Tipo de servicio, widget: string }
              - { name: serviceDescription, label: Descripción del servicio, widget: text }
              - { name: breadcrumbName, label: Nombre en la ruta de navegación, widget: string }
